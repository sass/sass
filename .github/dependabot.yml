---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "/"
    ignore:
      - dependency-name: "sass"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
